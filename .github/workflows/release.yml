name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.0.1). Creates GitHub Release vX.Y.Z with installable zip."
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: extension

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Sync package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Zip Chrome extension
        run: npm run zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: extension/.output/doubao-download-${{ steps.ver.outputs.version }}-chrome.zip
          body: |
            ## 安装

            1. 下载下方 `doubao-download-*-chrome.zip`
            2. 解压到任意文件夹
            3. Chrome 打开 `chrome://extensions` → 开启「开发者模式」
            4. 「加载已解压的扩展程序」→ 选解压后的目录（含 `manifest.json`）

            需要 Chrome 114+（Side Panel）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
